name: Release

# Cross-compiles the SoloSet launcher for Windows, macOS, and Linux and attaches
# the binaries to a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          build() {
            echo "building $3 ($1/$2)"
            GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "-s -w" -o "dist/$3" .
          }
          build windows amd64 SoloSet-windows-amd64.exe
          build darwin  arm64 SoloSet-macos-arm64
          build darwin  amd64 SoloSet-macos-amd64
          build linux   amd64 SoloSet-linux-amd64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*
          --title "${{ github.ref_name }}"
          --generate-notes
